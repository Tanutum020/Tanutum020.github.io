<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurea Clinic — ระบบบันทึกและติดตามการรักษา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#7FB5AB; --primary-deep:#4A8577; --secondary:#8FD4D0;
  --mint:#D9F0E8; --bg:#FFFFFF; --card:#F3FAF8; --border:#DCEAE5;
  --text:#28362F; --text-sub:#6B7D74; --text-faint:#A5B5AE;
  --happy:#4A8577; --happy-bg:#F3FAF8;
  --complant:#D08A5A; --complant-bg:#FBEEE4; --complant-border:#F0DCCB; --complant-text:#8A5C36;
  --review:#8083C0; --review-bg:#EDEDF8; --review-border:#DEDEF0; --review-text:#5B5E96;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:"Noto Sans Thai","Noto Sans",system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
a{color:var(--primary-deep);text-decoration:none}
a:hover{color:var(--text)}
input,select,textarea,button{font-family:inherit;font-size:inherit;color:inherit}
input::placeholder,textarea::placeholder{color:var(--text-faint)}
input,select,textarea{border:1px solid var(--border);border-radius:10px;padding:9px 11px;font-size:13px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary);background:var(--card)}
.font-heading{font-family:Prompt,sans-serif}
.btn{cursor:pointer;user-select:none}
.btn-primary{text-align:center;background:var(--primary);color:#fff;font-family:Prompt,sans-serif;font-weight:500;font-size:13px;padding:11px;border-radius:10px;border:none;cursor:pointer}
.btn-primary:hover{background:var(--primary-deep)}
.btn-outline{text-align:center;border:1px solid var(--border);font-size:13px;padding:11px 14px;border-radius:10px;color:var(--text-sub);cursor:pointer;background:#fff}
.btn-outline:hover{background:var(--card)}
.pill{font-size:11.5px;border-radius:20px;padding:3px 9px;display:inline-block}
.dot{display:inline-block;border-radius:3px}
.app-shell{display:grid;grid-template-columns:246px minmax(0,1fr);min-height:100vh;background:#fff}
aside.sidebar{border-right:1px solid var(--border);padding:22px 16px;display:flex;flex-direction:column;gap:22px;background:#fff;position:sticky;top:0;height:100vh;overflow:auto}
.logo-row{display:flex;align-items:center;gap:11px;padding:0 6px}
.logo-mark{width:34px;height:34px;border-radius:11px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-family:Prompt,sans-serif;font-weight:600;font-size:15px;color:#fff}
.logo-name{font-family:Prompt,sans-serif;font-weight:600;font-size:14.5px;letter-spacing:.01em}
.logo-sub{font-size:11px;color:var(--text-sub);margin-top:1px}
nav.mainnav{display:flex;flex-direction:column;gap:3px}
.nav-label{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-faint);font-family:Prompt,sans-serif;padding:0 8px 7px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-family:Prompt,sans-serif;font-weight:400;font-size:13.5px;cursor:pointer;color:var(--text-sub);border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:var(--card);color:var(--text)}
.nav-item.active{background:var(--mint);color:var(--text);font-weight:500}
.nav-dot{width:6px;height:6px;border-radius:50%;background:var(--border);flex:none}
.nav-item.active .nav-dot{background:var(--primary-deep)}
.nav-count{margin-left:auto;font-size:11.5px;font-family:Prompt,sans-serif;color:var(--text-faint)}
.nav-item.active .nav-count{color:var(--primary-deep)}
.sidebar-bottom{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.legend-box{border:1px solid var(--border);border-radius:12px;padding:13px 14px;display:flex;flex-direction:column;gap:9px}
.legend-title{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);font-family:Prompt,sans-serif}
.legend-item{display:flex;align-items:center;gap:8px;font-size:12px}
.user-row{border-top:1px solid var(--border);padding-top:13px;display:flex;align-items:center;gap:10px}
.avatar{width:31px;height:31px;border-radius:50%;background:var(--secondary);display:flex;align-items:center;justify-content:center;font-size:12px;font-family:Prompt,sans-serif;font-weight:500;color:var(--text);flex:none}
.user-name{font-size:12.5px;font-weight:500}
.user-role{font-size:11px;color:var(--text-sub)}
.logout-btn{margin-left:auto;font-size:11.5px;color:var(--text-sub);cursor:pointer;padding:5px 8px;border-radius:8px;background:none;border:none}
.logout-btn:hover{background:var(--card);color:var(--text)}
main.content{padding:28px 34px 46px;min-width:0}
header.pagehead{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:24px}
.crumb{font-size:11.5px;color:var(--text-sub);margin-bottom:5px}
.pagetitle{margin:0;font-family:Prompt,sans-serif;font-weight:600;font-size:24px;letter-spacing:.005em}
.pagedesc{margin:6px 0 0;font-size:13px;color:var(--text-sub);max-width:64ch}
.head-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.role-switch{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:10px;padding:7px 11px;white-space:nowrap}
.role-switch select{border:0;background:transparent;padding:0;font-size:12.5px;font-family:Prompt,sans-serif;font-weight:500;outline:none;cursor:pointer}
.today-chip{font-size:12.5px;color:var(--text-sub);border:1px solid var(--border);border-radius:10px;padding:8px 12px;white-space:nowrap}
section.card{border:1px solid var(--border);border-radius:12px}
.grid-auto{display:grid;gap:16px}
table.datatable{width:100%;border-collapse:collapse;font-size:12.5px}
table.datatable thead th{text-align:left;padding:10px 14px;font-family:Prompt,sans-serif;font-weight:500;font-size:11.5px;color:var(--text-sub);background:var(--card);border-bottom:1px solid var(--border)}
table.datatable tbody td{padding:12px 14px;border-top:1px solid var(--border);color:var(--text-sub)}
table.datatable tbody tr:hover{background:var(--card)}
.sortable{cursor:pointer;display:inline-flex;align-items:center;gap:4px;user-select:none}
.sortable:hover{color:var(--text)}
.search-input{position:relative}
.search-input input{padding-left:34px;width:100%}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-faint);pointer-events:none}
.tab-switch{display:inline-flex;gap:4px;border:1px solid var(--border);border-radius:11px;padding:4px;width:fit-content}
.tab-btn{padding:8px 16px;border-radius:8px;font-family:Prompt,sans-serif;font-size:13px;cursor:pointer;border:none;background:none;color:var(--text-sub)}
.tab-btn.active{background:var(--mint);font-weight:500;color:var(--text)}
.tab-btn:hover:not(.active){background:var(--card)}
.filter-chip{font-size:12px;padding:6px 11px;border-radius:20px;border:1px solid var(--border);color:var(--text-sub);cursor:pointer;background:#fff}
.filter-chip:hover{background:var(--card)}
.filter-chip.active{background:var(--mint);color:var(--text);font-family:Prompt,sans-serif;font-weight:500;border-color:var(--mint)}
.checkbox-row{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer}
.checkbox-row:hover{background:var(--card)}
.checkbox-row.checked{border-color:var(--primary);background:var(--card)}
.checkbox-box{width:17px;height:17px;border-radius:5px;border:1px solid var(--border);flex:none;display:flex;align-items:center;justify-content:center;font-size:11px}
.checkbox-box.checked{background:var(--primary);border-color:var(--primary);color:#fff}
.modal-overlay{position:fixed;inset:0;background:rgba(40,54,47,.32);display:flex;align-items:center;justify-content:center;padding:28px;z-index:40}
.modal-box{background:#fff;border:1px solid var(--border);border-radius:14px;width:min(560px,100%);max-height:88vh;overflow:auto;padding:24px}
.stat-card{border-radius:12px;padding:19px 20px;border:1px solid var(--border)}
.stat-card .stat-num{font-family:Prompt,sans-serif;font-weight:600;font-size:36px;line-height:1.1;margin-top:10px}
.stat-card .stat-label{display:flex;align-items:center;gap:8px;font-size:12.5px}
.stat-card .stat-sub{font-size:11.5px;margin-top:4px}
.hidden{display:none !important}
.thumb{border-radius:9px;border:1px solid var(--border);aspect-ratio:1;background:repeating-linear-gradient(135deg,var(--card) 0 8px,#E6F2EE 8px 16px);display:flex;align-items:flex-end;padding:6px}
.thumb-label{font-family:ui-monospace,Menlo,monospace;font-size:8.5px;color:var(--text-sub)}
.thumb-add{aspect-ratio:1;border-radius:10px;border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;color:var(--primary);font-size:18px;cursor:pointer;background:none}
.thumb-add:hover{background:var(--card)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;font-size:13px;padding:11px 18px;border-radius:10px;font-family:Prompt,sans-serif;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
@media(max-width:880px){
  .app-shell{grid-template-columns:1fr}
  aside.sidebar{display:none}
  main.content{padding:18px}
}
</style>
</head>

function showToast(msg){
  let t = document.getElementById('toast');
  if(!t){ t = document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

function suggestStatus(c){
  // simple deterministic mock suggestion based on id parity, just for demo purposes
  const options = ['happy','complant','review'];
  return options[c.id % 3];
}

function getCustomerHistory(c){
  // Mock visit history — deterministic per customer so it stays consistent across renders
  const base = [
    { date: c.date, procedure: c.procedure, doctor: c.doctor, status: c.status, price: '฿ ' + (8000 + (c.id*137)%9000).toLocaleString() },
  ];
  const extra = [
    { date:'12 ก.ค. 2569', procedure:'ปรึกษาเบื้องต้น + วิเคราะห์ผิว', doctor:c.doctor, status:'happy', price:'฿ 0 (ไม่มีค่าใช้จ่าย)' },
    { date:'02 ส.ค. 2569', procedure:'Botox หน้าผาก 20 u', doctor:c.doctor, status:'happy', price:'฿ 6,500' },
  ];
  if(c.id % 3 === 0){
    extra.push({ date:'20 ส.ค. 2569', procedure:'Filler ใต้ตา 1 cc', doctor:c.doctor, status:'review', price:'฿ 9,900' });
  }
  return [...base, ...extra].sort((a,b)=> a.date < b.date ? 1 : -1);
}

/* ======================= TRACKING ======================= */
function renderTracking(){
  const filters = ['ทั้งหมด','Happy','Complant','Review'];
  const filterKeyMap = { 'ทั้งหมด':null, 'Happy':'happy', 'Complant':'complant', 'Review':'review' };
  const activeKey = filterKeyMap[state.trackFilter];

  const visibleItems = trackItems
    .map((t, originalIndex) => ({ ...t, originalIndex }))
    .filter(t => activeKey===null || t.status===activeKey);

  const stillValid = visibleItems.some(t => t.originalIndex === state.trackIndex);
  const selectedOriginalIndex = stillValid ? state.trackIndex : (visibleItems[0] ? visibleItems[0].originalIndex : null);
  const item = selectedOriginalIndex !== null ? trackItems[selectedOriginalIndex] : null;
  const itemTimeline = selectedOriginalIndex !== null ? (timelineByIndex[selectedOriginalIndex] || timeline) : [];
  const currentStatusMeta = item ? STATUS_META[item.status] : null;

  return `
  <div class="grid-auto" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr));align-items:start">
    <section class="card" style="overflow:hidden">
      <div style="padding:14px 16px;border-bottom:1px solid var(--border)">
        <input placeholder="ค้นหาลูกค้า" style="width:100%">
        <div style="display:flex;gap:5px;margin-top:11px;flex-wrap:wrap">
          ${filters.map(f=>`<button class="filter-chip ${state.trackFilter===f?'active':''}" data-action="setTrackFilter" data-filter="${f}">${f}</button>`).join('')}
        </div>
      </div>
      <div style="display:flex;flex-direction:column">
        ${visibleItems.length===0 ? `<div style="padding:26px 16px;text-align:center;color:var(--text-faint);font-size:12.5px">ไม่มีเคสในสถานะนี้</div>` : visibleItems.map(t=>{
          const meta = STATUS_META[t.status];
          const active = t.originalIndex === selectedOriginalIndex;
          return `
          <div style="padding:13px 16px;border-bottom:1px solid var(--border);cursor:pointer;border-left:3px solid ${active?'var(--primary)':'transparent'};background:${active?'var(--card)':'transparent'}" data-action="setTrackIndex" data-idx="${t.originalIndex}">
            <div style="display:flex;align-items:center;gap:8px">
              <span style="font-size:12.5px;font-weight:500">${esc(t.patient)}</span>
              <span class="pill" style="background:${meta.bg};color:${meta.text};margin-left:auto;font-size:10.5px;padding:2px 7px">${meta.label}</span>
            </div>
            <div style="font-size:11.5px;color:var(--text-sub);margin-top:3px">${esc(t.proc)}</div>
          </div>`;
        }).join('')}
      </div>
    </section>

    <section class="card" style="padding:22px">
      ${!item ? `<div style="padding:40px;text-align:center;color:var(--text-faint);font-size:13px">เลือกเคสด้านซ้ายเพื่อดูไทม์ไลน์</div>` : `
      <div style="display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--border)">
        <div>
          <div style="font-family:Prompt,sans-serif;font-weight:600;font-size:17px">${esc(item.proc.split(' · ')[0])}</div>
          <div style="font-size:12.5px;color:var(--text-sub);margin-top:5px">${esc(item.patient)} · ${esc(item.proc.split(' · ')[1]||'')}</div>
        </div>
        <div style="margin-left:auto;display:flex;align-items:center;gap:9px">
          <span class="pill" style="background:${currentStatusMeta.bg};color:${currentStatusMeta.text}">สถานะปัจจุบัน · ${currentStatusMeta.label}</span>
          <button class="btn-outline" style="padding:8px 13px" data-nav="export">Export ประวัติเคสนี้</button>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;margin-top:20px">
        ${itemTimeline.map((e,ei)=>{
          const dotColor = e.kind==='happy' ? 'var(--happy)' : e.kind==='complant' ? 'var(--complant)' : 'var(--review)';
          const isLast = ei === itemTimeline.length - 1;
          return `
          <div style="display:grid;grid-template-columns:104px 24px minmax(0,1fr);gap:12px">
            <div style="text-align:right;padding-top:2px">
              <div style="font-family:Prompt,sans-serif;font-size:12.5px;font-weight:500">${e.date}</div>
              <div style="font-size:11px;color:var(--text-sub)">${e.time}</div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:center">
              <span style="width:11px;height:11px;border-radius:50%;background:${dotColor};margin-top:4px"></span>
              ${!isLast ? `<span style="flex:1;width:1px;background:var(--border);margin:5px 0"></span>` : ''}
            </div>
            <div style="padding-bottom:22px;min-width:0">
              <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">
                <span style="font-family:Prompt,sans-serif;font-weight:500;font-size:14px">${esc(e.title)}</span>

              </div>

              ${e.hasMedia ? `
                <div style="display:flex;gap:9px;margin-top:11px">
                  <div class="thumb" style="width:78px"><span class="thumb-label">${esc(e.mediaLabel)}</span></div>
                  <div class="thumb" style="width:78px"></div>
                </div>` : ''}
            </div>
          </div>`;
        }).join('')}
      </div>
      `}
    </section>
  </div>`;
}

/* ======================= RENDER + EVENTS ======================= */
function renderBody(){
  switch(state.screen){
    case 'dashboard': return renderDashboard();
    case 'input': return renderInput();
    case 'normal': return renderNormal();
    case 'customers': return renderCustomers();
    case 'complant': return renderComplant() + renderCloseCaseModal();
    case 'review': return renderReview();
    case 'tracking': return renderTracking();
    case 'export': return renderExport();
    default: return '';
  }
}

function render(){
  if(state.screen==='login'){
    document.getElementById('root').innerHTML = renderLogin();
  } else {
    document.getElementById('root').innerHTML = renderShell(renderBody());
  }
  bindEvents();
}

function bindEvents(){
  const root = document.getElementById('root');

  root.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', (e)=>{ go(el.getAttribute('data-nav')); });
  });

  const roleSelect = document.getElementById('roleSelect');
  if(roleSelect) roleSelect.addEventListener('change', e=> setRole(e.target.value));

  root.querySelectorAll('[data-action="logout"]').forEach(el=>el.addEventListener('click', ()=>{ go('login'); }));

  // Login
  root.querySelectorAll('[data-action="pickLoginRole"]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.loginRole = el.getAttribute('data-role'); render(); });
  });
  const doLoginBtn = root.querySelector('[data-action="doLogin"]');
  if(doLoginBtn) doLoginBtn.addEventListener('click', ()=>{
    state.role = state.loginRole;
    go('dashboard');
  });

  // Input
  root.querySelectorAll('[data-action="setInputMode"]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.inputMode = el.getAttribute('data-mode'); render(); });
  });
  const saveInputBtn = root.querySelector('[data-action="saveInput"]');
  if(saveInputBtn) saveInputBtn.addEventListener('click', ()=> showToast('บันทึกข้อมูลแล้ว (mockup) — สถานะเริ่มต้น Happy'));
  const csvSim = root.querySelector('[data-action="simulateCsv"]');
  if(csvSim) csvSim.addEventListener('click', ()=> showToast('เลือกไฟล์ patients_sep2026.csv แล้ว (mockup)'));
  const doCsv = root.querySelector('[data-action="doCsvImport"]');
  if(doCsv) doCsv.addEventListener('click', ()=>{
    showToast('นำเข้า 32 รายการแล้ว — ไปที่ Normal เพื่อกรองข้อมูล');
    go('normal');
  });

  // Normal
  const normalSearchInput = document.getElementById('normalSearchInput');
  if(normalSearchInput){
    normalSearchInput.addEventListener('input', e=>{ state.normalSearch = e.target.value; render(); restoreFocus('normalSearchInput'); });
  }
  root.querySelectorAll('[data-action="setNormalTab"]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.normalTab = el.getAttribute('data-tab'); render(); });
  });
  root.querySelectorAll('[data-action="toggleNormalSelect"]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const id = Number(el.getAttribute('data-id'));
      state.normalSelected[id] = el.checked;
    });
  });
  root.querySelectorAll('[data-action="confirmNormal"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = Number(el.getAttribute('data-id'));
      const status = el.getAttribute('data-status');
      const c = customers.find(x=>x.id===id);
      if(c){ c.status = status; }
      render();
      showToast('ยืนยันประเภทเคสแล้ว: ' + STATUS_META[status].label);
    });
  });
  root.querySelectorAll('[data-action="editNormal"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = Number(el.getAttribute('data-id'));
      const c = customers.find(x=>x.id===id);
      if(c){ c.status = 'unclassified'; }
      render();
    });
  });
  const confirmAllBtn = root.querySelector('[data-action="confirmAllNormal"]');
  if(confirmAllBtn) confirmAllBtn.addEventListener('click', ()=>{
    customers.filter(c=>c.status==='unclassified').forEach(c=>{ c.status = suggestStatus(c); });
    render();
    showToast('ยืนยันประเภทเคสทั้งหมดแล้ว');
  });

  // Customers
  const custSearchInput = document.getElementById('custSearchInput');
  if(custSearchInput){
    custSearchInput.addEventListener('input', e=>{ state.custSearch = e.target.value; render(); restoreFocus('custSearchInput'); });
  }
  root.querySelectorAll('[data-action="sortCustomers"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const field = el.getAttribute('data-field');
      if(state.custSort.field===field){ state.custSort.dir = state.custSort.dir==='asc' ? 'desc' : 'asc'; }
      else { state.custSort = {field, dir:'asc'}; }
      render();
    });
  });
  const addCustBtn = root.querySelector('[data-action="addCustomer"]');
  if(addCustBtn) addCustBtn.addEventListener('click', ()=>{ state.custEditing = 'new'; render(); });
  root.querySelectorAll('[data-action="editCustomer"]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.custEditing = Number(el.getAttribute('data-id')); render(); });
  });
  root.querySelectorAll('[data-action="askDeleteCustomer"]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.custDeleting = Number(el.getAttribute('data-id')); render(); });
  });
  root.querySelectorAll('[data-action="openCustHistory"]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.custHistoryFor = Number(el.getAttribute('data-id')); render(); });
  });
  const closeHistoryBtns = root.querySelectorAll('[data-action="closeHistoryModal"], [data-action="closeHistoryOverlay"]');
  closeHistoryBtns.forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(el.getAttribute('data-action')==='closeHistoryOverlay' && e.target.closest('[data-stop]')) return;
      state.custHistoryFor = null; render();
    });
  });
  const gotoTrackBtn = root.querySelector('[data-action="gotoTrackingFromHistory"]');
  if(gotoTrackBtn) gotoTrackBtn.addEventListener('click', ()=>{ state.custHistoryFor = null; go('tracking'); });
  const closeModalBtns = root.querySelectorAll('[data-action="closeModal"], [data-action="closeModalOverlay"]');
  closeModalBtns.forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(el.getAttribute('data-action')==='closeModalOverlay' && e.target.closest('[data-stop]')) return;
      state.custEditing = null; render();
    });
  });
  const closeDeleteBtns = root.querySelectorAll('[data-action="closeDeleteModal"], [data-action="closeDeleteOverlay"]');
  closeDeleteBtns.forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(el.getAttribute('data-action')==='closeDeleteOverlay' && e.target.closest('[data-stop]')) return;
      state.custDeleting = null; render();
    });
  });
  const saveCustBtn = root.querySelector('[data-action="saveCustomerModal"]');
  if(saveCustBtn) saveCustBtn.addEventListener('click', ()=>{
    const idAttr = saveCustBtn.getAttribute('data-id');
    const name = document.getElementById('edit_name').value.trim();
    const hn = document.getElementById('edit_hn').value.trim();
    const phone = document.getElementById('edit_phone').value.trim();
    const doctor = document.getElementById('edit_doctor').value;
    const type = document.getElementById('edit_type').value;
    const procedure = document.getElementById('edit_procedure').value.trim();
    const status = document.getElementById('edit_status').value;
    if(idAttr==='new'){
      const newId = Math.max(0,...customers.map(c=>c.id))+1;
      customers.push({ id:newId, name, hn, phone, type, doctor, sale:SALES[0], date:'08 ก.ย. 2569', procedure, status });
      showToast('เพิ่มลูกค้าใหม่แล้ว');
    } else {
      const id = Number(idAttr);
      const c = customers.find(x=>x.id===id);
      if(c){ Object.assign(c, {name,hn,phone,doctor,type,procedure,status}); }
      showToast('บันทึกการแก้ไขแล้ว');
    }
    state.custEditing = null;
    render();
  });
  const confirmDeleteBtn = root.querySelector('[data-action="confirmDeleteCustomer"]');
  if(confirmDeleteBtn) confirmDeleteBtn.addEventListener('click', ()=>{
    const id = Number(confirmDeleteBtn.getAttribute('data-id'));
    customers = customers.filter(c=>c.id!==id);
    state.custDeleting = null;
    render();
    showToast('ลบข้อมูลลูกค้าแล้ว');
  });

  // Complant
  root.querySelectorAll('[data-action="openCloseCase"]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.closingCase = Number(el.getAttribute('data-idx')); render(); });
  });
  const cancelCloseBtns = root.querySelectorAll('[data-action="cancelClose"]');
  cancelCloseBtns.forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(el.classList.contains('modal-overlay') && e.target.closest('[data-stop]')) return;
      state.closingCase = null; render();
    });
  });
  const confirmCloseBtn = root.querySelector('[data-action="confirmCloseCase"]');
  if(confirmCloseBtn) confirmCloseBtn.addEventListener('click', ()=>{
    state.closingCase = null;
    showToast('ปิดเคสแล้ว — สถานะกลับเป็น Happy');
    go('tracking');
  });
  const openComplantSuccessBtn = root.querySelector('[data-action="openComplantSuccess"]');
  if(openComplantSuccessBtn) openComplantSuccessBtn.addEventListener('click', ()=> showToast('เปิดเคส Complant แล้ว (mockup)'));

  // stop propagation inside modal box
  root.querySelectorAll('[data-stop]').forEach(el=>{
    el.addEventListener('click', e=> e.stopPropagation());
  });

  // Review
  root.querySelectorAll('[data-action="pickReview"]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.reviewPicked = Number(el.getAttribute('data-idx')); render(); });
  });
  const saveReviewBtn = root.querySelector('[data-action="saveReview"]');
  if(saveReviewBtn) saveReviewBtn.addEventListener('click', ()=> showToast('บันทึกรีวิวแล้ว (mockup)'));

  // Tracking
  root.querySelectorAll('[data-action="setTrackFilter"]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.trackFilter = el.getAttribute('data-filter'); render(); });
  });
  root.querySelectorAll('[data-action="setTrackIndex"]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.trackIndex = Number(el.getAttribute('data-idx')); render(); });
  });

  // Export
  root.querySelectorAll('[data-action="setScope"]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.scope = el.getAttribute('data-scope'); render(); });
  });
  root.querySelectorAll('[data-action="toggleField"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const f = el.getAttribute('data-field');
      state.fieldsOff[f] = !state.fieldsOff[f];
      render();
    });
  });
  const selAllBtn = root.querySelector('[data-action="selectAllFields"]');
  if(selAllBtn) selAllBtn.addEventListener('click', ()=>{ state.fieldsOff = {}; render(); });
  const clearAllBtn = root.querySelector('[data-action="clearAllFields"]');
  if(clearAllBtn) clearAllBtn.addEventListener('click', ()=>{
    const fieldGroups = [
      ['ชื่อ-นามสกุล','เบอร์โทร','ที่อยู่','วันเดือนปีเกิด / อายุ','อาชีพ','เชื้อชาติ / สัญชาติ','ประเภทลูกค้า','สิทธิประกันสังคม'],
      ['วันที่ทำหัตถการ','รายการหัตถการ','บริเวณ / ปริมาณ','ราคา','สถานะเคส','แพทย์ผู้ดูแล','พนักงานขาย (Sale)'],
      ['ข้อความจากลูกค้า','วิธีแก้ไข','จำนวนวันที่ใช้ปิดเคส','ข้อความรีวิว','ลิงก์รูปภาพ']
    ].flat();
    fieldGroups.forEach(f=> state.fieldsOff[f] = true);
    render();
  });
  root.querySelectorAll('[data-action="setFormat"]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.format = el.getAttribute('data-format'); render(); });
  });
  const doExportBtn = root.querySelector('[data-action="doExport"]');
  if(doExportBtn) doExportBtn.addEventListener('click', ()=> showToast('Export ' + state.format + ' สำเร็จ (mockup)'));
}

function restoreFocus(id){
  const el = document.getElementById(id);
  if(el){ el.focus(); const v = el.value; el.value=''; el.value=v; }
}

render();
</script>
</body>
</html>
